name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web game
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NevelskyiArt-Arkanoid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NevelskyiArt-Arkanoid-apk
          path: NevelskyiArt-Arkanoid.apk

      - name: Publish APK as a release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NevelskyiArt Arkanoid build ${{ github.run_number }}
          prerelease: true
          files: NevelskyiArt-Arkanoid.apk
